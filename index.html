<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Souk du Pirate</title>
<meta name="apple-mobile-web-app-title" content="Souk du Pirate">
<link rel="apple-touch-icon" href="https://soukdupirate.github.io/appli/apple-touch-icon.png">
<link rel="icon" type="image/png" href="https://soukdupirate.github.io/appli/favicon.png">
<meta name="theme-color" content="#ffffff">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,sans-serif;background:#fff;color:#111}img{width:200px;height:200px}a{display:inline-block;padding:14px 22px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700}</style>
</head>
<body>
<img src="https://soukdupirate.github.io/appli/icon-512.png" alt="Souk du Pirate">
<a id="go" href="https://script.google.com/macros/s/AKfycbxTTRFjtGI9Z-oiLErznQGbqAz_PlfHBwue7mh1KhfCITXfDtf-tp6r77h4wu_QiQAGfg/exec">Ouvrir l'appli</a>
<script>
/* L'icône de l'écran d'accueil enregistre l'adresse « ?ouvrir=1 » : en l'ouvrant, on entre directement dans l'appli.
   Sans ce paramètre (première visite), on affiche le logo pour pouvoir ajouter l'icône. */
var appUrl = document.getElementById('go').href;
var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
if (standalone || /[?&]ouvrir=1/.test(location.search)) location.replace(appUrl);
else if (history.replaceState) history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + '?ouvrir=1');
</script>
</body>
</html>
